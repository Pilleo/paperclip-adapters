name: Paperclip Adapters CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Test & Package Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Build
        run: pnpm -r build

      - name: Run Full Test Matrix (399+ unit tests)
        run: pnpm -r test

      - name: Build Production Packages (pnpm release:pack)
        run: pnpm release:pack

      - name: Upload Release Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-adapter-tarballs-node-${{ matrix.node-version }}
          path: dist-packages/*.tgz
          retention-days: 7
