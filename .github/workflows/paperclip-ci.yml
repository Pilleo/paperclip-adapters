name: Paperclip Adapters CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Test & Package Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Full Test Matrix (399+ unit tests)
        run: pnpm -r test

      - name: Install pinned Paperclip control plane
        if: matrix.node-version == '24.x'
        # Keep package download outside the server health budget. A cold npx
        # cache can take over a minute and otherwise looks like a boot failure.
        run: npm install --global paperclipai@2026.831.1

      - name: Start disposable Paperclip server
        # Adapter packages support Node 22, but the pinned Paperclip control
        # plane requires Node >=24.11 and deliberately refuses to boot on 22.
        # The 22.x job still validates build/test/package compatibility; the
        # native server contract runs once on its supported runtime.
        if: matrix.node-version == '24.x'
        env:
          HOME: ${{ runner.temp }}/paperclip-canary-user-home
          PAPERCLIP_HOME: ${{ runner.temp }}/paperclip-canary-home
          PAPERCLIP_INSTANCE_ID: canary
          PORT: 3100
          HOST: 127.0.0.1
        run: |
          # The orchestrator is an external process. Put the deterministic
          # GitHub fixture on the *server* PATH before boot so spawned adapter
          # processes inherit it; a client-side PATH change cannot test this.
          mkdir -p "${RUNNER_TEMP}/paperclip-e2e-bin"
          cat >"${RUNNER_TEMP}/paperclip-e2e-bin/gh" <<'EOF'
          #!/usr/bin/env sh
          case "$*" in
            *"pr list"*) printf '%s\n' '[{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/example/canary/pull/991","files":["canary.txt"]}]' ;;
            *"pr view"*) printf '%s\n' '{"mergeable":"MERGEABLE","mergeStateStatus":"CLEAN","headRefName":"canary","baseRefName":"main"}' ;;
            *"pr checks"*) printf '%s\n' '[{"state":"SUCCESS","bucket":"pass","name":"canary"}]' ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/paperclip-e2e-bin/gh"
          # Ensure PAPERCLIP_HOME exists so onboard doesn't try to write to root
          mkdir -p "$PAPERCLIP_HOME"
          # First run onboard to create the configuration
          paperclipai onboard --config "$PAPERCLIP_HOME/config.json" --data-dir "$PAPERCLIP_HOME" --yes --no-install-service >"${RUNNER_TEMP}/paperclip-onboard.log" 2>&1 || {
            cat "${RUNNER_TEMP}/paperclip-onboard.log"
            exit 1
          }
          # Start the actual server process using the supported `run` command
          PATH="${RUNNER_TEMP}/paperclip-e2e-bin:${PATH}" nohup setsid paperclipai run --config "$PAPERCLIP_HOME/config.json" >"${RUNNER_TEMP}/paperclip-canary.log" 2>&1 </dev/null &
          echo $! >"${RUNNER_TEMP}/paperclip-canary.pid"
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/paperclip-canary.log"
          exit 1

      - name: Run Jules recovery canary
        if: matrix.node-version == '24.x'
        env:
          PAPERCLIP_TEST_API_URL: http://127.0.0.1:3100
          PAPERCLIP_E2E_GH_FIXTURE: server
          WORKSPACE_PATH: ${{ github.workspace }}
        run: pnpm test:e2e:jules-recovery

      - name: Stop disposable Paperclip server
        if: always() && matrix.node-version == '24.x'
        run: |
          if [ -f "${RUNNER_TEMP}/paperclip-canary.pid" ]; then
            # Stop the complete onboarding/server process group, including
            # the embedded database child. A parent-only kill leaks CI state.
            kill -TERM -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")"
            for attempt in {1..50}; do
              if ! kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            if kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
              echo "Paperclip canary process group did not stop after SIGTERM" >&2
              kill -KILL -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")"
              exit 1
            fi
          fi
          if [ -f "${RUNNER_TEMP}/paperclip-canary.log" ]; then
            tail -100 "${RUNNER_TEMP}/paperclip-canary.log"
          fi

      - name: Build Production Packages (pnpm release:pack)
        run: pnpm release:pack

      - name: Upload Release Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-adapter-tarballs-node-${{ matrix.node-version }}
          path: dist-packages/*.tgz
          retention-days: 7
