name: Paperclip Adapters CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Test & Package Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Full Test Matrix (399+ unit tests)
        run: pnpm -r test

      - name: Test GitHub CLI Fixture
        run: node scripts/paperclip-ci-gh-fixture.test.mjs

      - name: Setup Node.js 24.x for Paperclip server
        if: matrix.node-version == '22.x'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pinned Paperclip control plane
        # Keep package download outside the server health budget. A cold npx
        # cache can take over a minute and otherwise looks like a boot failure.
        run: npm install --global paperclipai@2026.916.0

      - name: Start disposable Paperclip server
        # The orchestrator is an external process. Put the deterministic
        # GitHub fixture on the *server* PATH before boot so spawned adapter
        # processes inherit it; a client-side PATH change cannot test this.
        env:
          HOME: ${{ runner.temp }}/paperclip-canary-user-home
          PAPERCLIP_HOME: ${{ runner.temp }}/paperclip-canary-home
          PAPERCLIP_INSTANCE_ID: canary
          PORT: 3100
          HOST: 127.0.0.1
        run: |
          # The orchestrator is an external process. Put the deterministic
          # GitHub fixture on the *server* PATH before boot so spawned adapter
          # processes inherit it; a client-side PATH change cannot test this.
          mkdir -p "${RUNNER_TEMP}/paperclip-e2e-bin"
          cat >"${RUNNER_TEMP}/paperclip-e2e-bin/gh" <<'EOF'
          #!/usr/bin/env sh
          if [ "$#" -eq 10 ] && [ "$1" = "pr" ] && [ "$2" = "list" ] && [ "$3" = "--repo" ] && [ "$4" = "pilleo/paperclip-adapters" ] && [ "$5" = "--state" ] && [ "$6" = "all" ] && [ "$7" = "--limit" ] && [ "$8" = "50" ] && [ "$9" = "--json" ] && [ "${10}" = "number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" ]; then
            printf '%s\n' '[{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/pilleo/paperclip-adapters/pull/991","files":["canary.txt"]}]'
          elif [ "$#" -eq 7 ] && [ "$1" = "pr" ] && [ "$2" = "checks" ] && [ "$3" = "991" ] && [ "$4" = "--repo" ] && [ "$5" = "pilleo/paperclip-adapters" ] && [ "$6" = "--json" ] && [ "$7" = "state,bucket,name" ]; then
            printf '%s\n' '[{"state":"SUCCESS","bucket":"pass","name":"canary"}]'
          elif [ "$#" -eq 5 ] && [ "$1" = "pr" ] && [ "$2" = "view" ] && [ "$3" = "https://github.com/pilleo/paperclip-adapters/pull/991" ] && [ "$4" = "--json" ] && [ "$5" = "number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" ]; then
            printf '%s\n' '{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/pilleo/paperclip-adapters/pull/991","files":["canary.txt"]}'
          else
            exit 1
          fi
          EOF
          chmod +x "${RUNNER_TEMP}/paperclip-e2e-bin/gh"
          # In Paperclip 2026.916.0, noninteractive onboarding owns the
          # foreground server lifecycle. Start that one process in a separate
          # process group: waiting for onboarding and then invoking `run`
          # deadlocks until a timeout because onboarding does not return.
          # Pin the control-plane version used by the adapter contract test.
          # Floating latest made upstream releases silently change the canary
          # semantics before this repository had deliberately adopted them.
          PAPERCLIP_GH_PATH="${RUNNER_TEMP}/paperclip-e2e-bin/gh" PATH="${RUNNER_TEMP}/paperclip-e2e-bin:${PATH}" nohup setsid paperclipai onboard --config "$PAPERCLIP_HOME/config.json" --data-dir "$PAPERCLIP_HOME" --bind loopback --yes --no-install-service >"${RUNNER_TEMP}/paperclip-canary.log" 2>&1 </dev/null &
          echo $! >"${RUNNER_TEMP}/paperclip-canary.pid"
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/paperclip-canary.log"
          exit 1

      - name: Restore Node.js ${{ matrix.node-version }} for Canary
        if: matrix.node-version == '22.x'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Jules recovery canary
        env:
          PAPERCLIP_TEST_API_URL: http://127.0.0.1:3100
          PAPERCLIP_E2E_GH_FIXTURE: server
          WORKSPACE_PATH: ${{ github.workspace }}
        run: pnpm test:e2e:jules-recovery

      - name: Run supported-host positive native contracts
        if: matrix.node-version == '24.x'
        env:
          CONTRACT_REPORT_DIR: ${{ runner.temp }}/paperclip-native-contracts
        run: |
          PAPERCLIP_CONTRACT_NODE_MODULES="$(npm root --global)/paperclipai/node_modules" node scripts/paperclip-host-contract-gate.mjs

      - name: Upload sanitized native contract reports
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-native-contracts-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/paperclip-native-contracts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable Paperclip server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/paperclip-canary.pid" ]; then
            # Stop the complete onboarding/server process group, including
            # the embedded database child. A parent-only kill leaks CI state.
            kill -TERM -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" || true
            for attempt in {1..50}; do
              if ! kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            if kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
              echo "Paperclip canary process group did not stop after SIGTERM" >&2
              kill -KILL -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" || true
              exit 1
            fi
          fi
          if [ -f "${RUNNER_TEMP}/paperclip-canary.log" ]; then
            tail -100 "${RUNNER_TEMP}/paperclip-canary.log"
          fi

      - name: Build Production Packages (pnpm release:pack)
        run: pnpm release:pack

      - name: Upload Release Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-adapter-tarballs-node-${{ matrix.node-version }}
          path: dist-packages/*.tgz
          retention-days: 7
