name: Paperclip Adapters CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Test & Package Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Full Test Matrix (399+ unit tests)
        run: pnpm -r test

      - name: Setup Node.js 24.x for Server Background Process
        # The Paperclip control plane requires Node >=24.11 and deliberately refuses to boot on 22.
        # We switch to 24.x just to install and boot the disposable Paperclip instance.
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install pinned Paperclip control plane
        # Keep package download outside the server health budget. A cold npx
        # cache can take over a minute and otherwise looks like a boot failure.
        run: npm install --global paperclipai@2026.831.1

      - name: Start disposable Paperclip server
        env:
          HOME: ${{ runner.temp }}/paperclip-canary-user-home
          PAPERCLIP_HOME: ${{ runner.temp }}/paperclip-canary-home
          PAPERCLIP_INSTANCE_ID: canary
          PORT: 3100
          HOST: 127.0.0.1
        run: |
          # The orchestrator is an external process. Put the deterministic
          # GitHub fixture on the *server* PATH before boot so spawned adapter
          # processes inherit it; a client-side PATH change cannot test this.
          mkdir -p "${RUNNER_TEMP}/paperclip-e2e-bin"
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          cat >"${RUNNER_TEMP}/paperclip-e2e-bin/gh" <<EOF
          #!/usr/bin/env sh
          case "\$*" in
            "pr list --state all --limit 50 --json number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" | \
            "pr list --repo ${GITHUB_REPOSITORY} --state all --limit 50 --json number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" | \
            "pr list --repo ${REPO_LOWER} --state all --limit 50 --json number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files")
              printf '%s\n' '[{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/example/canary/pull/991","files":["canary.txt"]}]' ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/paperclip-e2e-bin/gh"
          # In Paperclip 2026.831.1, noninteractive onboarding with --yes also starts the server.
          # To satisfy the required startup lifecycle of both `onboard` and `run`, we
          # allow `onboard` to create the configuration, kill it gracefully once healthy,
          # and then natively use `run` as the primary background daemon.
          env -u JULES_API_KEY PATH="${RUNNER_TEMP}/paperclip-e2e-bin:${PATH}" paperclipai onboard --config "$PAPERCLIP_HOME/config.json" --data-dir "$PAPERCLIP_HOME" --bind loopback --yes --no-install-service >/dev/null 2>&1 &
          ONBOARD_PID=$!
          for attempt in {1..120}; do
            if curl --connect-timeout 1 --max-time 1 --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          kill -TERM $ONBOARD_PID
          while kill -0 $ONBOARD_PID 2>/dev/null; do sleep 0.2; done

          # Pin the control-plane version used by the adapter contract test.
          env -u JULES_API_KEY PATH="${RUNNER_TEMP}/paperclip-e2e-bin:${PATH}" nohup setsid paperclipai run --config "$PAPERCLIP_HOME/config.json" >"${RUNNER_TEMP}/paperclip-canary.log" 2>&1 </dev/null &
          echo $! >"${RUNNER_TEMP}/paperclip-canary.pid"
          for attempt in {1..120}; do
            if curl --connect-timeout 1 --max-time 1 --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/paperclip-canary.log"
          exit 1

      - name: Setup Node.js ${{ matrix.node-version }} for Canary Client
        # Restore the matrix target node version so the E2E adapter processes and
        # canary client are properly exercised against the requested version.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Run Jules recovery canary
        env:
          PAPERCLIP_TEST_API_URL: http://127.0.0.1:3100
          PAPERCLIP_E2E_GH_FIXTURE: server
          PAPERCLIP_E2E_GH_DIR: ${{ runner.temp }}/paperclip-e2e-bin
          WORKSPACE_PATH: ${{ github.workspace }}
        run: env -u JULES_API_KEY pnpm test:e2e:jules-recovery

      - name: Stop disposable Paperclip server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/paperclip-canary.pid" ]; then
            # Stop the complete onboarding/server process group, including
            # the embedded database child. A parent-only kill leaks CI state.
            kill -TERM -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")"
            for attempt in {1..50}; do
              if ! kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            if kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
              echo "Paperclip canary process group did not stop after SIGTERM" >&2
              kill -KILL -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")"
              exit 1
            fi
          fi
          if [ -f "${RUNNER_TEMP}/paperclip-canary.log" ]; then
            tail -100 "${RUNNER_TEMP}/paperclip-canary.log"
          fi

      - name: Build Production Packages (pnpm release:pack)
        run: pnpm release:pack

      - name: Upload Release Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-adapter-tarballs-node-${{ matrix.node-version }}
          path: dist-packages/*.tgz
          retention-days: 7
