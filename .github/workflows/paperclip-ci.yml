name: Paperclip Adapters CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Test & Package Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Typecheck negative domain invariants
        run: pnpm typecheck:invariants

      - name: Run Full Test Matrix (399+ unit tests)
        run: pnpm -r test

      - name: Test GitHub CLI Fixture
        run: node scripts/paperclip-ci-gh-fixture.test.mjs

      - name: Build Production Packages (pnpm release:pack)
        run: pnpm release:pack

      - name: Upload Release Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-adapter-tarballs-node-${{ matrix.node-version }}
          path: dist-packages/*.tgz
          retention-days: 7

  recovery_canary:
    name: Historical Jules PR authority hold on Paperclip 2026.916.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r build
      - name: Test GitHub CLI Fixture
        run: node scripts/paperclip-ci-gh-fixture.test.mjs
      - name: Install pinned Paperclip control plane
        run: npm install --global paperclipai@2026.916.0
      - name: Start disposable Paperclip server
        env:
          HOME: ${{ runner.temp }}/paperclip-canary-user-home
          PAPERCLIP_HOME: ${{ runner.temp }}/paperclip-canary-home
          PAPERCLIP_INSTANCE_ID: canary
          PORT: 3100
          HOST: 127.0.0.1
        run: |
          mkdir -p "${RUNNER_TEMP}/paperclip-e2e-bin"
          cat >"${RUNNER_TEMP}/paperclip-e2e-bin/gh" <<'EOF'
          #!/usr/bin/env sh
          if [ "$#" -eq 10 ] && [ "$1" = "pr" ] && [ "$2" = "list" ] && [ "$3" = "--repo" ] && [ "$4" = "pilleo/paperclip-adapters" ] && [ "$5" = "--state" ] && [ "$6" = "all" ] && [ "$7" = "--limit" ] && [ "$8" = "50" ] && [ "$9" = "--json" ] && [ "${10}" = "number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" ]; then
            printf '%s\n' '[{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/pilleo/paperclip-adapters/pull/991","files":["canary.txt"]}]'
          elif [ "$#" -eq 7 ] && [ "$1" = "pr" ] && [ "$2" = "checks" ] && [ "$3" = "991" ] && [ "$4" = "--repo" ] && [ "$5" = "pilleo/paperclip-adapters" ] && [ "$6" = "--json" ] && [ "$7" = "state,bucket,name" ]; then
            printf '%s\n' '[{"state":"SUCCESS","bucket":"pass","name":"canary"}]'
          elif [ "$#" -eq 5 ] && [ "$1" = "pr" ] && [ "$2" = "view" ] && [ "$3" = "https://github.com/pilleo/paperclip-adapters/pull/991" ] && [ "$4" = "--json" ] && [ "$5" = "number,title,state,headRefName,headRefOid,baseRefName,mergedAt,url,files" ]; then
            printf '%s\n' '{"number":991,"title":"canary","state":"OPEN","headRefName":"canary","headRefOid":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","baseRefName":"main","mergedAt":null,"url":"https://github.com/pilleo/paperclip-adapters/pull/991","files":["canary.txt"]}'
          else
            exit 1
          fi
          EOF
          chmod +x "${RUNNER_TEMP}/paperclip-e2e-bin/gh"
          PAPERCLIP_GH_PATH="${RUNNER_TEMP}/paperclip-e2e-bin/gh" PATH="${RUNNER_TEMP}/paperclip-e2e-bin:${PATH}" nohup setsid paperclipai onboard --config "$PAPERCLIP_HOME/config.json" --data-dir "$PAPERCLIP_HOME" --bind loopback --yes --no-install-service >"${RUNNER_TEMP}/paperclip-canary.log" 2>&1 </dev/null &
          echo $! >"${RUNNER_TEMP}/paperclip-canary.pid"
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/paperclip-canary.log"
          exit 1
      - name: Run Jules recovery authority-hold canary
        env:
          PAPERCLIP_TEST_API_URL: http://127.0.0.1:3100
          PAPERCLIP_E2E_GH_FIXTURE: server
          PAPERCLIP_E2E_DISPOSABLE_HOST: '1'
          PAPERCLIP_INSTANCE_ID: canary
          PAPERCLIP_HOME: ${{ runner.temp }}/paperclip-canary-home
          WORKSPACE_PATH: ${{ github.workspace }}
        run: pnpm test:e2e:jules-recovery
      - name: Stop disposable Paperclip server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/paperclip-canary.pid" ]; then
            kill -TERM -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" || true
            for attempt in {1..50}; do
              if ! kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            if kill -0 -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" 2>/dev/null; then
              echo "Paperclip canary process group did not stop after SIGTERM" >&2
              kill -KILL -- "-$(cat "${RUNNER_TEMP}/paperclip-canary.pid")" || true
              exit 1
            fi
          fi
          if [ -f "${RUNNER_TEMP}/paperclip-canary.log" ]; then
            tail -100 "${RUNNER_TEMP}/paperclip-canary.log"
          fi
          rm -rf "${RUNNER_TEMP}/paperclip-canary-home" "${RUNNER_TEMP}/paperclip-canary-user-home"

  native_contracts:
    name: Native upgrade contracts on Paperclip ${{ matrix.paperclip-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paperclip-version: ['2026.916.0', '2026.1001.0']
    env:
      PAPERCLIP_CONTRACT_VERSION: ${{ matrix.paperclip-version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r build
      - name: Test native gate and disposable host lifecycle
        run: node --test scripts/paperclip-host-contract-gate.test.mjs scripts/contract/host-installation.test.mjs scripts/contract/disposable-host.test.mjs scripts/contract/chain-github-fixture.test.mjs scripts/contract/autonomous-observer.test.mjs scripts/contract/native-acp-fixture.test.mjs scripts/contract/local-acp-repair-fixture.test.mjs scripts/contract/accepted-response-loss.test.mjs scripts/contract/pending-merge-wait.test.mjs scripts/contract/merge-reconciliation-mutation.test.mjs scripts/fleet/task-drain-reload.test.mjs scripts/fleet/reload_adapters_cli.test.mjs
      - name: Install pinned Paperclip control plane
        run: |
          npm install --global paperclipai@${{ matrix.paperclip-version }}
          echo "PAPERCLIP_CONTRACT_NODE_MODULES=$(npm root --global)/paperclipai/node_modules" >> "$GITHUB_ENV"
          echo "CONTRACT_REPORT_DIR=$RUNNER_TEMP/paperclip-native-contracts" >> "$GITHUB_ENV"
      - name: Verify actual external ACP read and write permissions
        run: node packages/orchestrator/test/contract/acp-permissions-live.mjs
      - name: Verify disposable host persists data across a real server restart
        run: node packages/orchestrator/test/contract/disposable-host-live.mjs
      - name: Verify baseline database and pending native card survive candidate migration
        if: matrix.paperclip-version == '2026.1001.0'
        run: |
          npm install --prefix "$RUNNER_TEMP/paperclip-upgrade-baseline" --no-audit --no-fund paperclipai@2026.916.0
          node packages/orchestrator/test/contract/disposable-host-live.mjs --upgrade-from="$RUNNER_TEMP/paperclip-upgrade-baseline/node_modules"
      - name: Verify immutable approval response queues during an active run
        if: matrix.paperclip-version == '2026.1001.0'
        run: node packages/orchestrator/test/contract/queued-response-live.mjs --kind=confirmation
      - name: Verify exact native answer queues during an active run
        if: matrix.paperclip-version == '2026.1001.0'
        run: node packages/orchestrator/test/contract/queued-response-live.mjs --kind=question
      - name: Verify Jules approval and typed plan reviews survive Paperclip restart before PR delivery
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs
      - name: Verify autonomous native plan reviews and same-session PR delivery after daemon restart
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous
      - name: Verify prior-run reviewer errors do not become permanent administrative admission holds
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-merge --reviewer-error
      - name: Verify unapproved provider drift preserves native reviews and observation across restart
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-plan-provider-drift
      - name: Verify adapter deployment automatically converges legacy provider-observation holds
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-legacy-plan-provider-hold
      - name: Verify recovered native Jules questions keep a truthful blocked wait and resume the original session
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-question-recovery
      - name: Verify native human waits survive restart and user merge releases approved dependent work
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-dependency
      - name: Verify remotely accepted plan approval recovers after its acknowledgement is lost
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-lost-approval
      - name: Verify configured independent conflict repair preserves native reviews
        run: node packages/orchestrator/test/contract/jules-server-restart.mjs --autonomous-conflict
      - name: Verify manual-default conflict wait and external resolution across restart
        run: node packages/orchestrator/test/contract/conflict-recovery-live.mjs --conflict-recovery-mode=default
      - name: Verify deterministic clean integration preserves reviews and releases dependencies
        run: node packages/orchestrator/test/contract/conflict-recovery-live.mjs --conflict-recovery-mode=git_only --conflict-shape=disjoint
      - name: Verify unresolved git-only conflict never delegates to AI
        run: node packages/orchestrator/test/contract/conflict-recovery-live.mjs --conflict-recovery-mode=git_only --conflict-shape=overlap
      - name: Verify configured remote agent repairs the original PR without re-review
        run: node packages/orchestrator/test/contract/conflict-recovery-live.mjs --conflict-recovery-mode=agent --repair-agent-adapter=jules
      - name: Verify the adapter recovers a missing required PR on its original session
        run: node packages/orchestrator/test/contract/conflict-recovery-live.mjs --conflict-recovery-mode=agent --repair-agent-adapter=process --initial-no-pr
      - name: Prove manual-policy and no-re-review regression detection with restoration
        run: node scripts/contract/autonomous-conflict-mutation.mjs
      - name: Prove autonomous dependency regression detection with a compiled private mutation and restoration
        run: node scripts/contract/autonomous-merge-mutation.mjs
      - name: Prove uncertain approval recovery across restart with a compiled private mutation and restoration
        run: node scripts/contract/autonomous-approval-loss-mutation.mjs
      - name: Verify exact recovery and reload regressions on installed host
        run: |
          export PAPERCLIP_CONTRACT_NODE_MODULES="$(npm root --global)/paperclipai/node_modules"
          pnpm exec tsx packages/jules/test/contract/no-pr-confirmation-recovery.mjs --require-safe
          pnpm exec tsx packages/orchestrator/test/contract/task-drain-reload.mjs
          pnpm exec tsx packages/orchestrator/test/contract/queued-ancestry-board-recovery.mjs
      - name: Run supported-host positive native contracts
        env:
          CONTRACT_REPORT_DIR: ${{ runner.temp }}/paperclip-native-contracts
          CONTRACT_SCENARIO_TIMEOUT_MS: '600000'
        run: |
          PAPERCLIP_CONTRACT_NODE_MODULES="$(npm root --global)/paperclipai/node_modules" node scripts/paperclip-host-contract-gate.mjs
      - name: Upload sanitized native contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-native-contracts-${{ matrix.paperclip-version }}-node-24.x
          path: ${{ runner.temp }}/paperclip-native-contracts/**/*.json
          if-no-files-found: ignore
          retention-days: 7
