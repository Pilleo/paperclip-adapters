name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflow semantics
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= .github/workflows/ci.yml .github/workflows/paperclip-ci.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Test committed-secret guard
        run: node --test scripts/check-no-secrets.test.mjs

      - name: Scan committed files for secrets
        run: pnpm check:secrets -- --all

      - name: Build all packages
        run: pnpm -r build

      - name: Reject illegal domain state types
        run: pnpm typecheck:invariants

      - name: Run test suites across all packages
        run: pnpm -r test
